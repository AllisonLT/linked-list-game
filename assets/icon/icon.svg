<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#141c2b" />
      <stop offset="100%" stop-color="#090d14" />
    </radialGradient>

    <!-- Node Body Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#222f46" />
      <stop offset="100%" stop-color="#121926" />
    </linearGradient>

    <!-- Edge Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- App Icon Canvas / Backdrop -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />

  <!-- Outer Glow Outline Pass -->
  <path d="
    M 140,140
    H 216
    A 40,40 0 0,0 296,140
    H 372
    V 216
    A 40,40 0 0,1 372,296
    V 372
    H 140
    Z"
    fill="none"
    stroke="#38bdf8"
    stroke-width="14"
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#neonGlow)"
    opacity="0.75"
  />

  <!-- Main Puzzle Node Body -->
  <path d="
    M 140,140
    H 216
    A 40,40 0 0,0 296,140
    H 372
    V 216
    A 40,40 0 0,1 372,296
    V 372
    H 140
    Z"
    fill="url(#bodyGrad)"
    stroke="#60a5fa"
    stroke-width="4"
    stroke-linejoin="round"
    filter="url(#shadow)"
  />

  <!-- Inner Soft Bevel Highlight -->
  <path d="
    M 146,146
    H 214
    A 42,42 0 0,0 298,146
    H 366
    V 214"
    fill="none"
    stroke="#93c5fd"
    stroke-width="2.5"
    stroke-linecap="round"
    opacity="0.4"
  />
</svg>
