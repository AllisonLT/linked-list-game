<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Translucent yellow cellophane tape gradient -->
    <linearGradient id="activeTapeGrad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#fef08a" stop-opacity="0.80" />
      <stop offset="100%" stop-color="#fef9c3" stop-opacity="0.65" />
    </linearGradient>
  </defs>

  <!-- Dispenser Body -->
  <path d="
    M 14 88
    C 14 54 36 40 58 40
    L 82 40
    C 88 40 92 46 90 52
    L 86 88
    C 84 92 80 96 74 96
    L 22 96
    C 18 96 14 92 14 88 Z" fill="#38bdf8" stroke="#0284c7" stroke-width="3" stroke-linejoin="round" />

  <!-- Tape Spool Core & Hub -->
  <circle cx="44" cy="68" r="20" fill="#0284c7" />
  <circle cx="44" cy="68" r="15" fill="#f8fafc" />
  <circle cx="44" cy="68" r="7.5" fill="#38bdf8" />

  <!-- Serrated Metal Cutting Blade -->
  <polygon points="82,37 90,37 86,43" fill="#94a3b8" stroke="#475569" stroke-width="1" />

  <!-- Extended Strip Peeling Off Spool and Extending Out Forward -->
  <polygon points="
    44,48
    84,39
    118,52
    116,60
    83,46
    44,56" fill="url(#activeTapeGrad)" stroke="#facc15" stroke-width="1.2" stroke-linejoin="round" />

  <!-- Leading Adhesive Edge Angle Cut -->
  <line x1="118" y1="52" x2="116" y2="60" stroke="#eab308" stroke-width="1.5" stroke-linecap="round" />
</svg>