<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Warm brass/gold gradient matching drawer hardware -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <g>
    <!-- Bow / Handle Ring at Top (Hollow compound path) -->
    <path d="
      M 64 15
      A 18 18 0 1 0 64 51
      A 18 18 0 1 0 64 15
      Z
      M 64 24
      A 9 9 0 1 1 64 42
      A 9 9 0 1 1 64 24
      Z" fill-rule="evenodd" fill="url(#brassGrad)" stroke="#78350f" stroke-width="2.5" />

    <!-- Bow Inner Bevel Highlight -->
    <path d="M 52 24 A 15 15 0 0 1 76 24" fill="none" stroke="#fef9c3" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

    <!-- Decorative Shaft Collar Rings -->
    <rect x="57.5" y="51" width="13" height="3" rx="1.5" fill="url(#brassGrad)" stroke="#78350f" stroke-width="1.5" />
    <rect x="56" y="55" width="16" height="4" rx="2" fill="url(#brassGrad)" stroke="#78350f" stroke-width="1.5" />

    <!-- Main Cylindrical Shaft Pointing Down -->
    <rect x="60" y="58" width="8" height="50" rx="4" fill="url(#brassGrad)" stroke="#78350f" stroke-width="2" />

    <!-- Skeleton Key Notched Bit (Teeth) on Right -->
    <path d="
      M 68 82
      H 84
      C 86 82 87 83 87 85
      V 93
      H 78
      V 97
      H 87
      V 101
      C 87 103 86 104 84 104
      H 68
      Z" fill="url(#brassGrad)" stroke="#78350f" stroke-width="2" stroke-linejoin="round" />

    <!-- Specular Highlight down the Shaft -->
    <line x1="62" y1="60" x2="62" y2="104" stroke="#fef9c3" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />

    <!-- Tip Finial Bulb at Bottom -->
    <circle cx="64" cy="108" r="5" fill="url(#brassGrad)" stroke="#78350f" stroke-width="2" />
    <circle cx="63" cy="107" r="1.5" fill="#fef9c3" opacity="0.9" />
  </g>
</svg>